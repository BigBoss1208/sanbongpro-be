server:
  address: 0.0.0.0
  forward-headers-strategy: framework
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 30000
      data-source-properties:
        sslmode: verify-full
        sslfactory: org.postgresql.ssl.DefaultJavaSSLFactory
  jpa:
    hibernate:
      ddl-auto: validate
